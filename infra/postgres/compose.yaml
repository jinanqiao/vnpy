services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ${POSTGRES_CONTAINER:-vnpy-timescaledb}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnpy_quant}
      POSTGRES_USER: ${POSTGRES_USER:-vnpy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vnpy_timescaledb_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnpy} -d ${POSTGRES_DB:-vnpy_quant}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  vnpy_timescaledb_data:
